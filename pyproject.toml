[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Modular Polymarket analysis bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
polymarket-bot = "polymarket_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
